plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yasserapps.store'
    compileSdk 35

    defaultConfig {
        applicationId 'com.yasserapps.store'
        minSdk 26
        targetSdk 35
        versionCode 40
        versionName '12.0.0'
        testInstrumentationRunner 'com.yasserapps.store.DirectCatalogTest'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Android SDK signing verifier: cryptographic APK v2/v3 validation.
dependencies { implementation "com.android.tools.build:apksig:8.10.1" }

dependencies { implementation "org.jsoup:jsoup:1.18.3" }

dependencies { implementation "com.google.mlkit:translate:17.0.3"; implementation "com.google.mlkit:language-id:17.0.6" }
