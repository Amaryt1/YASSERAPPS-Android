name: Publish signed YASSERAPPS APK

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: yasserapps-production-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Set up Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Check owner-managed signing secrets
        env:
          KEYSTORE_B64: ${{ secrets.YASSERAPPS_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.YASSERAPPS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YASSERAPPS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.YASSERAPPS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for item in "$KEYSTORE_B64" "$STORE_PASS" "$KEY_ALIAS" "$KEY_PASS"; do
            if [ -z "$item" ]; then
              echo "::error::Add the four YASSERAPPS release signing secrets before publishing."
              exit 1
            fi
          done
      - name: Build release APK
        working-directory: independent
        run: gradle --no-daemon :app:assembleRelease
      - name: Sign and verify release
        env:
          KEYSTORE_B64: ${{ secrets.YASSERAPPS_KEYSTORE_B64 }}
          STORE_PASS: ${{ secrets.YASSERAPPS_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.YASSERAPPS_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.YASSERAPPS_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p signed "$RUNNER_TEMP/yasser-keystore"
          trap 'rm -rf "$RUNNER_TEMP/yasser-keystore"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/yasser-keystore/release.jks"
          chmod 600 "$RUNNER_TEMP/yasser-keystore/release.jks"
          VERSION_NAME="$(grep -m1 'versionName' independent/app/build.gradle | cut -d "'" -f2)"
          VERSION_CODE="$(grep -m1 'versionCode' independent/app/build.gradle | awk '{print $2}')"
          test -n "$VERSION_NAME" && test -n "$VERSION_CODE"
          TAG="v$VERSION_NAME"
          ARTIFACT="YASSERAPPS-$TAG.apk"
          APK_SIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          INPUT="independent/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$INPUT"
          "$APK_SIGNER" sign --ks "$RUNNER_TEMP/yasser-keystore/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out "signed/$ARTIFACT" "$INPUT"
          "$APK_SIGNER" verify --verbose --print-certs "signed/$ARTIFACT" > signed/signing-report.txt
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "signed/$ARTIFACT" | head -5
          echo "release_tag=$TAG" >> "$GITHUB_ENV"
          echo "release_apk=$ARTIFACT" >> "$GITHUB_ENV"
          echo "release_version=$VERSION_NAME" >> "$GITHUB_ENV"
          echo "release_code=$VERSION_CODE" >> "$GITHUB_ENV"
      - name: Publish a NEW GitHub Release, never replace old signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Tag already published: $release_tag"
            exit 1
          fi
          gh release create "$release_tag" "signed/$release_apk" --repo "$GITHUB_REPOSITORY" --title "YASSERAPPS $release_version" --notes "إصدار رسمي موقّع من YASSERAPPS. التثبيت بموافقة المستخدم."
      - name: Create integrity-checked self-update feed
        run: |
          set -euo pipefail
          python3 scripts/publish_release.py --apk "signed/$release_apk" --repository "$GITHUB_REPOSITORY" --tag "$release_tag" --version "$release_version" --version-code "$release_code"
          python3 -m json.tool catalog/store-release.json >/dev/null
      - name: Upload signature report
        uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Official-Release-Proofs
          path: |
            signed/signing-report.txt
            store-release-sha256.txt
          retention-days: 90
      - name: Publish update metadata to GitHub
        run: |
          set -euo pipefail
          git config user.name "yasserapps-release-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/store-release.json
          git commit -m "Publish signed YASSERAPPS $release_version update metadata"
          git pull --rebase origin main
          git push origin HEAD:main
