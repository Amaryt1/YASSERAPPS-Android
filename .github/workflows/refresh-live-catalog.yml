name: Refresh authorized YASSERAPPS catalogue
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/generate_live_catalog.py'
      - 'catalog/build_api.py'
      - 'catalog/provider_sync.py'
      - 'catalog/provider_formats.py'
      - 'catalog/mod-source-candidates.json'
      - 'catalog/approved-mod-feeds/**'
      - 'catalog/api/review/**'
      - 'catalog/provider-contract/**'
      - 'catalog/test_review_api_snapshot.py'
      - '.github/workflows/refresh-live-catalog.yml'
permissions:
  contents: read
concurrency:
  group: yasserapps-server-catalog
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Test provider integration
        run: |
          python3 -m py_compile catalog/generate_live_catalog.py catalog/provider_sync.py catalog/provider_formats.py catalog/build_api.py
          python3 -m unittest discover -s catalog -p test_provider_sync.py
          python3 -m unittest discover -s catalog -p test_review_api_snapshot.py
      - name: Generate candidate catalogue without publishing
        run: |
          python3 catalog/generate_live_catalog.py --output catalog/generated/full-index.json --min-new 500
          python3 catalog/build_api.py --input catalog/generated/full-index.json --legacy-output catalog/generated/index.json
      - uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Catalogue-Review
          path: catalog/api/v1
          retention-days: 7
