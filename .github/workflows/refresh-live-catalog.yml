name: Refresh YASSERAPPS four-source metadata catalogue
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/generate_market_catalog.py'
      - 'catalog/build_market_api.py'
      - 'catalog/sources.json'
      - '.github/workflows/refresh-live-catalog.yml'
permissions:
  contents: write
concurrency:
  group: yasserapps-server-catalog
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validate historical snapshot and API compatibility
        run: |
          python3 -m py_compile catalog/generate_market_catalog.py catalog/build_market_api.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('catalog/generated/full-index.json').read_text())
          assert 0<len(d['apps'])<=50000
          assert len({a['id'] for a in d['apps']})==len(d['apps'])
          assert all(a['sourceName'] in ('Aptoide','Uptodown','TapTap','APKMirror') and a['discoveryOnly'] and not a['apkUrl'] for a in d['apps'])
          print('Restored metadata:',len(d['apps']))
          PY
      - name: Refresh public metadata
        run: |
          python3 catalog/generate_market_catalog.py --output catalog/generated/full-index.json --min-new 500
          python3 catalog/build_market_api.py --input catalog/generated/full-index.json --legacy-output catalog/generated/index.json
      - name: Publish metadata only
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/generated/full-index.json catalog/generated/index.json catalog/api/v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh restored four-source metadata catalogue"
          git pull --rebase origin main
          git push origin HEAD:main
