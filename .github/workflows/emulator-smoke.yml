name: Smoke test YASSERAPPS APK on Android emulator

on:
  workflow_run:
    workflows:
      - Build YASSERAPPS Android APK
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/emulator-smoke.yml'
      - 'scripts/smoke-test-android.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  launch-smoke:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Use JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Identify last successful APK build
        id: build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            run_id="${{ github.event.workflow_run.id }}"
          else
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow 'Build YASSERAPPS Android APK' --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          fi
          test -n "$run_id"
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Download built Android APK
        uses: actions/download-artifact@v4
        with:
          name: YASSERAPPS-Android-Debug-APK
          run-id: ${{ steps.build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Enable KVM support
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Launch on Android 15 emulator and check for fatal crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash scripts/smoke-test-android.sh
      - name: Upload emulator diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Emulator-Logcat
          path: |
            emulator-logcat.txt
            app-pid.txt
          if-no-files-found: warn
          retention-days: 14
