name: Verify existing open-source modified APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-reviewed-apk.yml'
permissions:
  contents: write
concurrency:
  group: reviewed-mod-apk
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Verify official release APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/quillpad.apk"
          curl --fail --location --proto '=https' --proto-redir '=https' --max-time 120 --retry 2 'https://github.com/quillpad/quillpad/releases/download/v1.5.16/quillpad-1.5.16.apk' -o "$APK"
          echo '2a04f693f760084058896551f7cb1dd6b6c0149ea8ddfabde8a09aeb8960996d  '"$APK" | sha256sum -c -
          SDK="$ANDROID_HOME/build-tools/35.0.0"
          if [ ! -x "$SDK/apksigner" ]; then "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'; fi
          "$SDK/apksigner" verify --min-sdk-version 26 --verbose --print-certs "$APK" > "$RUNNER_TEMP/signature.txt"
          "$SDK/aapt" dump badging "$APK" > "$RUNNER_TEMP/badging.txt"
          python3 - "$APK" "$RUNNER_TEMP/signature.txt" "$RUNNER_TEMP/badging.txt" <<'PY'
          import sys,json,re,hashlib
          from pathlib import Path
          apk,signature,badging=map(Path,sys.argv[1:])
          sig=signature.read_text()
          cert=re.findall(r'Signer #\d+ certificate SHA-256 digest: ([a-fA-F0-9]{64})',sig)
          assert len(cert)==1
          assert re.search(r'Verified using v[23] scheme.*: true',sig)
          m=re.search(r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']+)'",badging.read_text())
          assert m and m[1]=='io.github.quillpad' and m[3]=='1.5.16', 'Unexpected release identity'
          assert apk.stat().st_size==4560063
          path=Path('catalog/approved-mod-feeds/quillpad.json')
          data=json.loads(path.read_text())
          item=data['apps'][0]
          assert item['packageName']==m[1] and item['modified'] is True
          item.update(version=m[3],versionCode=int(m[2]),sizeBytes=apk.stat().st_size,
                      apkUrl='https://github.com/quillpad/quillpad/releases/download/v1.5.16/quillpad-1.5.16.apk',
                      sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),
                      signerSha256=cert[0].lower(),
                      publisherUrl='https://github.com/quillpad/quillpad/releases/tag/v1.5.16')
          data['reviewNotes']='Existing GPL-licensed derivative. APK digest pinned from official GitHub release metadata; verified package, version, size and cryptographic signature in CI. Not a release from the six target sources.'
          path.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n')
          print('Verified release identity:',m[1],m[2],m[3])
          PY
      - name: Publish verified metadata and rebuild catalog
        shell: bash
        run: |
          set -euo pipefail
          python3 -m unittest discover -s catalog -p test_provider_sync.py
          python3 catalog/generate_live_catalog.py --output catalog/generated/full-index.json --min-new 500
          python3 catalog/build_api.py --input catalog/generated/full-index.json --legacy-output catalog/generated/index.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/approved-mod-feeds/quillpad.json catalog/generated/full-index.json catalog/generated/index.json catalog/api/v1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Publish verified Quillpad APK metadata for native download test'
          git pull --rebase origin main
          git push origin HEAD:main
