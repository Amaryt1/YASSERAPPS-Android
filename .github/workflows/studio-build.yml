name: YASSERAPPS Studio isolated build
on:
  push:
    branches: [studio-v02-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Use preinstalled Android SDK
        run: |
          echo "$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          ls "$ANDROID_HOME/platforms"
          ls "$ANDROID_HOME/build-tools"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)"
          test -x "$SDKMANAGER"
          if [ ! -f "$ANDROID_HOME/platforms/android-35/android.jar" ] || [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then
            "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug testDebugUnitTest --no-daemon
      - run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/YASSERAPPS-Studio-V0.9.4-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/YASSERAPPS-Studio-V0.9.4-test.apk
          sha256sum output/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Studio-V0.9.4-test
          path: output/*.apk
