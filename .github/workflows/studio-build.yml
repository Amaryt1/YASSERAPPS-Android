name: YASSERAPPS Studio isolated build
on:
  push:
    branches: [studio-v02-build]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle assembleDebug --no-daemon
      - run: |
          mkdir -p output
          cp app/build/outputs/apk/debug/app-debug.apk output/YASSERAPPS-Studio-V0.2-test.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose output/YASSERAPPS-Studio-V0.2-test.apk
          sha256sum output/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Studio-V0.2-test
          path: output/*.apk
