name: Build Independent YASSERAPPS APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'independent/**'
      - 'scripts/embed_catalog_media.py'
      - '.github/workflows/build-independent.yml'
  push:
    branches: [main, feature/live-api-11.0.7, feature/expanded-catalog-11.0.8]
    paths:
      - 'independent/**'
      - '.github/workflows/build-independent.yml'

permissions:
  contents: read

concurrency:
  group: independent-yasserapps
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout YASSERAPPS-only project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Embed actual server catalogue snapshot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p independent/app/src/main/assets
          DEST=independent/app/src/main/assets/server-catalog.json
          if ! curl -fsSL --retry 2 'https://raw.githubusercontent.com/Amaryt1/YASSERAPPS-Android/main/catalog/generated/index.json' -o "$DEST"; then
            curl -fsSL 'https://raw.githubusercontent.com/Amaryt1/YASSERAPPS-Android/155f7bc4c0c7b61e4926299459a91c004683b3c5/catalog/generate_live_catalog.py' -o /tmp/yasser-catalog.py
            python3 /tmp/yasser-catalog.py --output "$DEST" --min-new 500
          fi
          python3 - "$DEST" <<'PY'
          import json,sys
          d=json.load(open(sys.argv[1]))
          assert d['schemaVersion']==1 and 0<len(d['apps'])<=20000
          assert len(d['apps'])==d['report']['total']
          assert all(a['discoveryOnly'] and not a['apkUrl'] for a in d['apps'])
          print("EMBEDDED_CATALOG",json.dumps(d['report']))
          PY

      - name: Compile independent APK
        working-directory: independent
        run: gradle --no-daemon :app:assembleDebug :app:assembleDebugAndroidTest --stacktrace

      - name: Verify APK binary and independent package
        shell: bash
        run: |
          set -euo pipefail
          APK="independent/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          unzip -t "$APK" > /dev/null
          if unzip -l "$APK" | grep -q yasserapps_starter_catalog; then exit 1; fi
          unzip -l "$APK" | grep -F assets/server-catalog.json
          echo "APK archive integrity verified"

      - name: Upload YASSERAPPS-independent APK
        uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Independent-APK
          path: independent/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Enable emulator virtualization for catalog regression
        if: github.event_name == 'pull_request'
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi

      - name: Verify signed upstream indexes and Android catalog rendering
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash independent/scripts/direct-source-smoke.sh
