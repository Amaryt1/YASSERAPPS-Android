name: Build Independent YASSERAPPS APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'independent/**'
      - '.github/workflows/build-independent.yml'

permissions:
  contents: read

concurrency:
  group: independent-yasserapps
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Checkout YASSERAPPS-only project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Embed verified offline starter catalog
        run: |
          python3 scripts/validate_catalog.py catalog/apps.json
          mkdir -p independent/app/src/main/assets
          cp catalog/apps.json independent/app/src/main/assets/yasserapps_starter_catalog.json
          python3 scripts/embed_catalog_media.py catalog/apps.json independent/app/src/main/assets/catalog_media
      - name: Compile independent APK
        working-directory: independent
        run: gradle --no-daemon :app:assembleDebug --stacktrace

      - name: Verify APK binary and independent package
        shell: bash
        run: |
          set -euo pipefail
          APK="independent/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -10
          unzip -t "$APK" > /dev/null
          echo "APK archive integrity verified"

      - name: Upload YASSERAPPS-independent APK
        uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Independent-APK
          path: independent/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
