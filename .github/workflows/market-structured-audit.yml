name: Audit public structured marketplace catalogs
on:
  pull_request:
    paths:
      - '.github/workflows/market-structured-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect public chart metadata only
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, re, json, time
          from html.parser import HTMLParser
          class Parser(HTMLParser):
              def __init__(self):
                  super().__init__(); self.active=False; self.parts=[]; self.blocks=[]; self.links=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('type','').lower()=='application/ld+json': self.active=True; self.parts=[]
                  if tag=='a' and a.get('href'): self.links.append(a['href'])
              def handle_data(self, data):
                  if self.active: self.parts.append(data)
              def handle_endtag(self, tag):
                  if tag=='script' and self.active: self.blocks.append(''.join(self.parts)); self.active=False
          sources=[
            ('Uptodown apps','https://en.uptodown.com/android/apps/top'),
            ('Uptodown games','https://en.uptodown.com/android/games/top'),
            ('TapTap','https://www.taptap.io/top/'),
            ('APKPure','https://apkpure.net/partner-developers-apps-on-apkpure'),
            ('LiteAPKs','https://liteapks.com/robots.txt'),
            ('Aurora','https://auroraoss.com/aurora-store'),
            ('APKMirror','https://www.apkmirror.com/feed/'),
            ('Aptoide','https://ws75.aptoide.com/api/7/apps/get/group_name=games/limit=5/offset=0/mature=false/sort=downloads')]
          def walk(v):
              if isinstance(v,dict):
                  if '@type' in v: yield (str(v['@type']),sorted(v.keys()),len(v.get('itemListElement',[])) if isinstance(v.get('itemListElement'),list) else 0)
                  for x in v.values(): yield from walk(x)
              elif isinstance(v,list):
                  for x in v: yield from walk(x)
          for name,url in sources:
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'YASSERAPPS-Structure-Audit/1.0'})
                  with urllib.request.urlopen(req,timeout=12) as r:
                      raw=r.read(4*1024*1024+1)
                      if len(raw)>4*1024*1024: raise ValueError('response limit')
                      p=Parser(); p.feed(raw.decode('utf-8','replace'))
                      print('STRUCTURED_SOURCE',name,r.status,r.headers.get('Content-Type'),'jsonld',len(p.blocks))
                      for block in p.blocks[:20]:
                          try: print('SCHEMA',name,list(walk(json.loads(block)))[:20])
                          except ValueError: print('INVALID_JSONLD',name)
                      print('PUBLIC_LINK_SAMPLE',name,[x for x in dict.fromkeys(p.links) if re.search(r'\.en\.uptodown\.com/android/?$|/app/[0-9]+|/apk/',x)][:5])
              except urllib.error.HTTPError as e: print('SOURCE_UNAVAILABLE',name,e.code)
              except Exception as e: print('SOURCE_UNAVAILABLE',name,type(e).__name__)
              time.sleep(1)
          PY
