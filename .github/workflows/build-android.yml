name: Build YASSERAPPS Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-android.yml'
      - 'YASSERAPPS_Vyxel_BuildKit.zip'
      - 'README.md'
      - 'scripts/yasserapps_home_hotfix.py'
      - 'scripts/yasserapps_store_cleanup.py'
      - 'scripts/yasserapps_catalog_integration.py'
      - 'android/YasserCatalog.kt'
      - 'android/YasserStoreUi.kt'

permissions:
  contents: read

concurrency:
  group: yasserapps-android-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    steps:
      - name: Checkout YASSERAPPS project
        uses: actions/checkout@v4

      - name: Verify and extract YASSERAPPS build kit
        shell: bash
        run: |
          set -euo pipefail
          echo 'f660f15ea2d95969604c94e404220c882c41905c1ed774bb8ce3717472af4cca  YASSERAPPS_Vyxel_BuildKit.zip' | sha256sum -c -
          unzip -tq YASSERAPPS_Vyxel_BuildKit.zip
          mkdir -p buildkit
          unzip -q YASSERAPPS_Vyxel_BuildKit.zip -d buildkit
          python3 -m py_compile buildkit/customize.py

      - name: Checkout exact Vyxel Apps AGPL-3.0 source
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/NikhilKain/vyxel-apps.git upstream
          git -C upstream checkout e13fc79fa6523f794b258b253170423036eb3d3a

      - name: Apply YASSERAPPS brand, icon and channel
        run: python3 buildkit/customize.py upstream

      - name: Apply YASSERAPPS home and update hotfix
        run: python3 scripts/yasserapps_home_hotfix.py upstream

      - name: Clean YASSERAPPS storefront and launcher artwork
        run: python3 scripts/yasserapps_store_cleanup.py upstream

      - name: Integrate YASSERAPPS native catalog and detail screens
        run: python3 scripts/yasserapps_catalog_integration.py upstream

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 37.0 SDK preview
        shell: bash
        run: |
          set -euo pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --channel=3 --install 'platforms;android-37.0' 'build-tools;37.0.0' 'platform-tools'

      - name: Configure Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Android-Debug-APK
          path: upstream/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload corresponding modified source for AGPL compliance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Modified-Source
          path: |
            upstream/app/src/
            upstream/app/build.gradle.kts
            upstream/settings.gradle.kts
            upstream/gradle/
            upstream/gradlew
            upstream/gradlew.bat
            upstream/gradle.properties
            upstream/build.gradle.kts
            upstream/LICENSE
            upstream/NOTICE
            upstream/YASSERAPPS_ORIGIN.md
          if-no-files-found: warn
          retention-days: 30
