name: Build and publish official YASSERAPPS release
on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish signed APK and enable the official update feed'
        type: boolean
        default: false
      notes:
        description: 'Release notes for users'
        type: string
        default: 'تحديث متجر YASSERAPPS'
permissions:
  contents: write
concurrency:
  group: yasserapps-official-release
  cancel-in-progress: false
jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Check signing secrets are configured
        env:
          KEYSTORE: ${{ secrets.YASSER_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.YASSER_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.YASSER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE" && test -n "$STORE_PASS" && test -n "$KEY_PASS" || { echo "Missing YASSERAPPS signing secrets"; exit 1; }
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Embed catalogue
        run: |
          mkdir -p independent/app/src/main/assets
          cp catalog/generated/full-index.json independent/app/src/main/assets/server-catalog.json
          cp catalog/generated/direct-index.json independent/app/src/main/assets/direct-catalog.json
      - name: Build unsigned release
        working-directory: independent
        run: gradle --no-daemon -PmobileOnly :app:assembleRelease
      - name: Sign and verify the official APK
        env:
          KEYSTORE: ${{ secrets.YASSER_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.YASSER_STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.YASSER_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYFILE="$(mktemp "$RUNNER_TEMP/yasser-key.XXXXXX")"
          trap 'rm -f "$KEYFILE"' EXIT
          printf '%s' "$KEYSTORE" | base64 --decode > "$KEYFILE"
          TOOL="$ANDROID_HOME/build-tools/35.0.0"
          UNSIGNED=independent/app/build/outputs/apk/release/app-release-unsigned.apk
          "$TOOL/zipalign" -P 16 -f 4 "$UNSIGNED" "$RUNNER_TEMP/aligned.apk"
          mkdir -p official
          "$TOOL/apksigner" sign --ks "$KEYFILE" --ks-key-alias yasserapps-release --ks-pass env:STORE_PASS --key-pass env:KEY_PASS --out official/YASSERAPPS.apk "$RUNNER_TEMP/aligned.apk"
          "$TOOL/apksigner" verify --verbose --print-certs official/YASSERAPPS.apk > "$RUNNER_TEMP/cert.txt"
          grep -F "Signer #1 certificate SHA-256 digest: be68375e728239aeeb11fa39e80c3e667e6a363b5ce53c47437c094b673d7463" "$RUNNER_TEMP/cert.txt"
          "$TOOL/aapt" dump badging official/YASSERAPPS.apk | head -1 > "$RUNNER_TEMP/badging.txt"
          unzip -t official/YASSERAPPS.apk >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Official-Signed
          path: official/YASSERAPPS.apk
          if-no-files-found: error
      - name: Publish official release and update feed
        if: inputs.publish == true
        env:
          GH_TOKEN: ${{ github.token }}
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os,re
          from pathlib import Path
          s=(Path(os.environ["RUNNER_TEMP"])/"badging.txt").read_text()
          assert "name='com.yasserapps.store'" in s
          version=re.search(r"versionName='([^']+)'",s).group(1)
          code=int(re.search(r"versionCode='(\d+)'",s).group(1))
          assert re.fullmatch(r"[0-9]+(?:\.[0-9]+){2,3}",version)
          path=Path("catalog/store-release.json")
          previous=json.loads(path.read_text())
          assert not previous.get("enabled") or code>previous["versionCode"],"Version code must increase"
          apk=Path("official/YASSERAPPS.apk")
          tag="yasserapps-v"+version
          manifest=dict(schemaVersion=1,store="YASSERAPPS",enabled=True,versionCode=code,version=version,apkUrl=f"https://github.com/Amaryt1/YASSERAPPS-Android/releases/download/{tag}/YASSERAPPS.apk",sha256=hashlib.sha256(apk.read_bytes()).hexdigest(),signerSha256="be68375e728239aeeb11fa39e80c3e667e6a363b5ce53c47437c094b673d7463",sizeBytes=apk.stat().st_size,notes=os.environ["NOTES"][:4000])
          path.write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+"\n")
          with open(os.environ["GITHUB_ENV"],"a") as f:f.write("RELEASE_TAG="+tag+"\n")
          PY
          gh release create "$RELEASE_TAG" official/YASSERAPPS.apk --target "$GITHUB_SHA" --title "$RELEASE_TAG" --notes "$NOTES"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/store-release.json
          git commit -m "Publish official signed YASSERAPPS update"
          git pull --rebase origin main
          git push origin HEAD:main
