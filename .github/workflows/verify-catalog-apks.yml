name: Verify official YASSERAPPS APK catalog

on:
  workflow_dispatch:
  push:
    paths:
      - 'catalog/apps.json'
      - 'scripts/verify_catalog_assets.py'
  schedule:
    - cron: '17 5 * * 1'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install Android build tools
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install 'build-tools;35.0.0' 'platforms;android-35'
      - name: Verify official HTTPS binaries, SHA256 and package metadata
        run: |
          python3 scripts/validate_catalog.py catalog/apps.json
          python3 scripts/verify_catalog_assets.py "$ANDROID_HOME/build-tools/35.0.0/aapt"
