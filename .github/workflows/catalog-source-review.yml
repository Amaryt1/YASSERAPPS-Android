name: Validate direct source configuration
on:
  workflow_dispatch:
  pull_request:
    paths: ['catalog/sources.json', '.github/workflows/catalog-source-review.yml']
  push:
    branches: [main]
    paths: ['catalog/sources.json', '.github/workflows/catalog-source-review.yml']
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python3 - <<'PY'
          import json,re
          cfg=json.load(open('catalog/sources.json'))
          assert cfg['sources']==[] and cfg['gameFeeds']==[] and cfg['discoveryCandidates']==[]
          candidates=cfg['largeCatalogCandidates']
          assert len(candidates)==7 and {s['id'] for s in candidates}=={'aptoide','apkpure','liteapks','taptap','aurora','uptodown','apkmirror'}
          assert {s['id'] for s in candidates if s['enabled']}=={'aptoide','apkmirror','uptodown','taptap'}
          sources=cfg['sources']
          for source in sources:
              if source['enabled']:
                  assert source['mode']=='direct'
                  assert source['baseUrl'].startswith('https://')
                  assert re.fullmatch(r'[0-9A-Fa-f]{64}',source['fingerprint'])
          print('Direct source configuration valid; no catalog publishing')
          PY
