name: Manage YASSERAPPS announcements
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Publish or edit, hide, delete"
        type: choice
        options: [publish, hide, delete]
        required: true
        default: publish
      notice_id:
        description: "Unique ID (example: news-001)"
        required: true
        type: string
      title:
        description: "Notification title"
        type: string
      body:
        description: "Notification text"
        type: string
      kind:
        description: "Notification type"
        type: choice
        options: [news, update, addition, maintenance]
        default: news
permissions:
  contents: write
concurrency:
  group: yasserapps-notices
  cancel-in-progress: false
jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate announcement editor
        run: |
          python3 - <<'PY'
          from scripts.notice_admin import edit
          d=edit({"schemaVersion":1,"notices":[]},"publish","test","Title","Body","news",1)
          assert d["notices"][0]["enabled"]
          assert not edit(d,"hide","test")["notices"][0]["enabled"]
          assert not edit(d,"delete","test")["notices"]
          PY
      - name: Publish announcement
        env:
          NOTICE_OPERATION: ${{ inputs.operation }}
          NOTICE_ID: ${{ inputs.notice_id }}
          NOTICE_TITLE: ${{ inputs.title }}
          NOTICE_BODY: ${{ inputs.body }}
          NOTICE_TYPE: ${{ inputs.kind }}
        run: python3 scripts/notice_admin.py
      - name: Save announcement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/notices.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish YASSERAPPS announcement"
          git pull --rebase origin main
          git push origin HEAD:main
