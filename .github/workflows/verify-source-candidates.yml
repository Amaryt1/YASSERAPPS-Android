name: Verify target MOD source import candidates
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/verify_source_candidates.py'
      - 'catalog/review_metadata.py'
      - 'catalog/test_review_metadata.py'
      - 'catalog/mod-source-candidates.json'
      - '.github/workflows/verify-source-candidates.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - run: python3 -m py_compile catalog/verify_source_candidates.py catalog/probe_sources.py catalog/review_metadata.py
      - run: python3 -m unittest discover -s catalog -p test_review_metadata.py
      - run: |
          if [ ! -x "$ANDROID_HOME/build-tools/35.0.0/apksigner" ]; then "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'build-tools;35.0.0'; fi
          python3 catalog/verify_source_candidates.py
      - uses: actions/upload-artifact@v4
        with:
          name: target-source-import-review
          path: catalog/source-import-review.json
