name: Verify YASSERAPPS direct download metadata
on:
  schedule:
    - cron: '03,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/verify_direct_index.py'
permissions:
  contents: write
concurrency:
  group: yasser-direct-index
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Test queue and refresh policy
        run: python3 -m unittest discover -s catalog -p test_verify_direct_index.py
      - run: python3 catalog/verify_direct_index.py --limit 480 --budget-seconds 680
      - run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add catalog/generated/direct-index.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Refresh eligible direct APK metadata"
          git pull --rebase origin main
          git push origin HEAD:main
