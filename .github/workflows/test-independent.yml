name: Test Independent YASSERAPPS on Android

on:
  workflow_run:
    workflows:
      - Build Independent YASSERAPPS APK
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-independent.yml'
      - 'independent/scripts/smoke.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  startup:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Pick independent successful APK build
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            run_id="$(gh run list -R "$GITHUB_REPOSITORY" --workflow 'Build Independent YASSERAPPS APK' --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
            test -n "$run_id"
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          name: YASSERAPPS-Independent-APK
          run-id: ${{ steps.pick.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: apk
      - name: Configure Android emulator virtualization
        run: if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test install, launch and no immediate crash
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: bash independent/scripts/smoke.sh
      - name: Export debug log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YASSERAPPS-Independent-Test-Logs
          path: |
            independent-emulator-logcat.txt
            independent-pid.txt
          if-no-files-found: warn
          retention-days: 14
